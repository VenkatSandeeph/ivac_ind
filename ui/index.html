<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IVAC Launcher</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="left-controls">
        <div class="title">IVAC Automation Launcher</div>
      </div>
      <div class="right-controls">
        <div id="status" class="badge stopped">Stopped</div>
      </div>
    </div>

    <div class="main">
      <section class="panel">
        <h2 id="configHeader">User: <span id="configUser">Unknown</span></h2>
        <p>
          Runtime file: <span id="configPath"></span>
        </p>
        <div id="appointmentDetails" class="appointment-details"></div>
        <p>
          Chrome debug status: <span id="chromeStatusText">Unknown</span>
        </p>
        <div class="actions">
          <button id="reloadConfig">Reload Config</button>
          <button id="panelStart" class="primary">Start</button>
          <button id="panelStop" class="danger">Stop</button>
          <button id="connectChrome" class="primary">Connect Chrome</button>
        </div>
        
        <div class="row">
          <label for="retryTime">Retry Time (seconds):</label>
          <input id="retryTime" type="text" value="10" />
          <small>Base retry per-city; actual delay = base + Random(2s)</small>
        </div>
      </section>

      <section class="panel">
        <h2>Logs</h2>
          <p>No logs</p>
          <div class="log-header">
            <button id="clearLogs">Clear logs</button>
          </div>
            <pre id="logBox"></pre>
      </section>
    </div>
  </div>

  <script src="./renderer.js"></script>
</body>
</html>
